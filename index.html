<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ဖတ်ဖူးတဲ့ စာအုပ်များ</title>

<style>
  /* ---------- font ---------- */
  @font-face {
    font-family: 'Myanmar Sagar';
    src: url('MyanmarSagar.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* ---------- tokens ---------- */
  :root {
    --paper:    #f1efe9;
    --ink:      #3b3833;
    --muted:    #8b8578;
    --rule:     #e2ded4;
    --accent:   #55665f;
    --shell:    #e7e3d9;

    --col-margin: 116px;   /* left margin column that holds the date */
    --gap:        28px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #1a1917;
      --ink:    #d4cec2;
      --muted:  #857f74;
      --rule:   #2e2c28;
      --accent: #92a89d;
      --shell:  #26241f;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Myanmar Sagar', 'Noto Sans Myanmar', 'Padauk', sans-serif;
    font-size: 17.5px;
    line-height: 2;
    letter-spacing: 0.005em;
    padding: 84px 28px 120px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .container { max-width: 860px; margin: 0 auto; }

  /* ---------- header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--rule);
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .who-name { font-size: 14.5px; color: var(--muted); }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--shell);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 17px;
    line-height: 1;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- search ---------- */
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .count { font-size: 14px; color: var(--muted); }

  .toggle {
    background: none;
    border: none;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
  }

  .toggle:hover, .toggle:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }

  .search {
    display: none;
    gap: 24px;
    margin-top: 20px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .search.open { display: flex; }

  .field { flex: 1 1 200px; }

  .field input {
    width: 100%;
    padding: 4px 0 9px;
    border: none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }

  .field input::placeholder { color: var(--muted); }
  .field input:focus { border-bottom-color: var(--accent); }

  .clear {
    background: none;
    border: none;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 0 9px;
  }

  .clear:hover { color: var(--accent); }

  /* ---------- entries ---------- */
  .list { margin-top: 8px; }

  .entry {
    display: grid;
    grid-template-columns: var(--col-margin) minmax(0, 1fr);
    gap: var(--gap);
    padding: 34px 0;
    border-bottom: 1px solid var(--rule);
  }

  .when {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 2.1;
    padding-top: 3px;
  }

  .title {
    font-size: 1.28rem;
    line-height: 1.7;
    margin-bottom: 2px;
  }

  .writer {
    font-size: 15.5px;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .meta { font-size: 15px; color: var(--muted); }

  .meta div { display: flex; gap: 8px; }

  .meta b { font-weight: 400; color: var(--muted); flex-shrink: 0; }

  .meta span { color: var(--ink); }

  .note {
    margin-top: 18px;
    padding-left: 18px;
    border-left: 1px solid var(--rule);
    font-size: 16.5px;
    line-height: 2.05;
    white-space: pre-line;
  }

  .note-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* ---------- states ---------- */
  .state {
    padding: 64px 0;
    color: var(--muted);
    font-size: 15.5px;
  }

  .state small { display: block; margin-top: 8px; opacity: 0.7; font-size: 13px; }

  /* ---------- pagination ---------- */
  .pages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 44px;
    flex-wrap: wrap;
  }

  .page {
    background: none;
    border: none;
    font: inherit;
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
    min-width: 18px;
  }

  .page:hover:not(:disabled) { color: var(--accent); }
  .page.on { color: var(--ink); border-bottom-color: var(--accent); }
  .page:disabled { opacity: 0.28; cursor: default; }

  .dots { color: var(--muted); }

  .page-note {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 620px) {
    body { padding: 44px 20px 72px; font-size: 17px; }
    header { flex-direction: column; align-items: flex-start; gap: 18px; }
    h1 { font-size: 1.45rem; }
    .entry { grid-template-columns: 1fr; gap: 6px; padding: 28px 0; }
    .when { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1>ဖတ်ဖူးတဲ့ စာအုပ်များ</h1>
      <p class="subtitle">Google Sheet မှ တိုက်ရိုက် ယူထားသော စာအုပ်မှတ်တမ်း</p>
    </div>
    <div class="who">
      <span class="who-name">ဟိန်းထက်</span>
      <div class="avatar" id="avatar">
        <img src="profile.png" alt="ဟိန်းထက်"
             onerror="document.getElementById('avatar').textContent='ဟ'">
      </div>
    </div>
  </header>

  <div class="bar">
    <span class="count" id="count"></span>
    <button class="toggle" id="toggle">ရှာရန်</button>
  </div>

  <div class="search" id="search">
    <div class="field"><input type="text" id="qBook" placeholder="စာအုပ်နာမည်"></div>
    <div class="field"><input type="text" id="qWriter" placeholder="စာရေးသူ"></div>
    <button class="clear" id="clear">ဖျက်</button>
  </div>

  <div class="list" id="list"><p class="state">ခဏစောင့်ပါ…</p></div>
  <div id="pages"></div>
</div>

<script>
  const CSV_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQGqSeOBUkUNLG0seN_cGPtDp9ldSvKasKVdeDCCliwHwVZQWLRQMtRgbOOtJLUFeZZ9dNiS49GlTKK/pub?gid=910367330&single=true&output=csv';
  const PER_PAGE   = 5;
  const ONLY_EMAIL = 'mynameisheinhtet@gmail.com';

  const COL_EMAIL = 1, COL_BOOK = 2, COL_WRITER = 3, COL_TRANS_FROM = 4,
        COL_ORIG_BOOK = 5, COL_ORIG_WRITER = 6, COL_DATE = 9,
        COL_COMMENT = 10, COL_MONTH = 11, COL_YEAR = 12;

  const MONTHS_MY = ['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်',
                     'ဇူလိုင်','ဩဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];

  const MONTH_EN = ['january','february','march','april','may','june',
                    'july','august','september','october','november','december',
                    'jan','feb','mar','apr','may','jun',
                    'jul','aug','sep','oct','nov','dec'];

  let allBooks = [], filtered = [], currentPage = 1;

  const listEl   = document.getElementById('list');
  const pagesEl  = document.getElementById('pages');
  const countEl  = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const toggleEl = document.getElementById('toggle');
  const qBook    = document.getElementById('qBook');
  const qWriter  = document.getElementById('qWriter');

  toggleEl.addEventListener('click', () => {
    searchEl.classList.toggle('open');
    if (searchEl.classList.contains('open')) qBook.focus();
  });

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQ) {
        if (ch === '"' && next === '"') { cell += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cell += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n' || (ch === '\r' && next === '\n')) {
          row.push(cell); cell = '';
          if (row.some(c => c !== '')) rows.push(row);
          row = [];
          if (ch === '\r') i++;
        } else cell += ch;
      }
    }
    row.push(cell);
    if (row.some(c => c !== '')) rows.push(row);
    return rows;
  }

  function monthIndex(name) {
    const idx = MONTH_EN.indexOf(name.toLowerCase().replace(/\./g, ''));
    return idx >= 0 ? idx % 12 : -1;
  }

  function parseDateStr(raw) {
    if (!raw) return null;
    const str = raw.replace(/[\s\u00A0]+/g, ' ').trim();
    if (!str) return null;
    const cleaned = str.replace(/(\d+)(st|nd|rd|th)/gi, '$1');

    const dmy = cleaned.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})$/);
    if (dmy) {
      const m = monthIndex(dmy[2]);
      if (m >= 0) return { month: MONTHS_MY[m], year: +dmy[3] };
    }

    const mdy = cleaned.match(/^([a-zA-Z]+)\s+(\d{1,2}),?\s+(\d{4})$/);
    if (mdy) {
      const m = monthIndex(mdy[1]);
      if (m >= 0) return { month: MONTHS_MY[m], year: +mdy[3] };
    }

    const slash = cleaned.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (slash) {
      const a = +slash[1], b = +slash[2], year = +slash[3];
      if (a > 12 && b >= 1 && b <= 12) return { month: MONTHS_MY[b - 1], year };
      if (a >= 1 && a <= 12) return { month: MONTHS_MY[a - 1], year };
    }

    const iso = cleaned.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) return { month: MONTHS_MY[+iso[2] - 1], year: +iso[1] };

    const d = new Date(cleaned);
    if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
      return { month: MONTHS_MY[d.getMonth()], year: d.getFullYear() };
    }
    return null;
  }

  function getDate(r) {
    const m = (r[COL_MONTH] || '').trim();
    const y = (r[COL_YEAR] || '').trim();
    let mi = -1, yr = 0;

    if (m) {
      mi = monthIndex(m);
      if (mi < 0) { const n = parseInt(m, 10); if (n >= 1 && n <= 12) mi = n - 1; }
      if (mi < 0) { const j = MONTHS_MY.indexOf(m); if (j >= 0) mi = j; }
    }
    if (y) { yr = parseInt(y, 10) || 0; }
    if (mi >= 0 && yr > 2000) return { month: MONTHS_MY[mi], year: yr };
    return parseDateStr(r[COL_DATE]);
  }

  async function loadData() {
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = parseCSV(await res.text()).slice(1);

      allBooks = rows.map(r => {
        const email = (r[COL_EMAIL] || '').trim().toLowerCase();
        const book  = (r[COL_BOOK] || '').trim();
        if (email !== ONLY_EMAIL || !book) return null;
        const dt = getDate(r);
        return {
          book,
          writer:     (r[COL_WRITER] || '').trim(),
          transFrom:  (r[COL_TRANS_FROM] || '').trim(),
          origBook:   (r[COL_ORIG_BOOK] || '').trim(),
          origWriter: (r[COL_ORIG_WRITER] || '').trim(),
          comment:    (r[COL_COMMENT] || '').trim(),
          month: dt ? dt.month : '',
          year:  dt ? dt.year : ''
        };
      }).filter(Boolean).reverse();

      if (!allBooks.length) {
        listEl.innerHTML = '<p class="state">စာအုပ်မှတ်တမ်း မရှိသေးပါ</p>';
        return;
      }

      filtered = [...allBooks];
      currentPage = 1;
      render();
    } catch (err) {
      listEl.innerHTML = '<p class="state">ဒေတာ ခေါ်မရပါ။ Sheet ကို Publish လုပ်ထားခြင်း ရှိ၊ မရှိ စစ်ပါ။'
        + '<small>' + esc(err.message) + '</small></p>';
    }
  }

  function render() {
    const total = filtered.length;
    const totalPages = Math.ceil(total / PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages || 1;

    if (!total) {
      listEl.innerHTML = '<p class="state">ကိုက်ညီသော စာအုပ် မတွေ့ပါ</p>';
      pagesEl.innerHTML = '';
      countEl.textContent = '';
      return;
    }

    const searching = qBook.value || qWriter.value;
    countEl.textContent = searching ? `တွေ့ရှိသည် — ${total} အုပ်` : `စုစုပေါင်း ${total} အုပ်`;

    const page = filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

    listEl.innerHTML = page.map(b => {
      const when = [b.month, b.year].filter(Boolean).join(' ');

      const meta = [];
      if (b.transFrom)  meta.push(['ဘာသာပြန်', b.transFrom]);
      if (b.origBook)   meta.push(['မူရင်းစာအုပ်', b.origBook]);
      if (b.origWriter) meta.push(['မူရင်းစာရေးသူ', b.origWriter]);

      return '<article class="entry">'
        + `<div class="when">${esc(when)}</div>`
        + '<div>'
        +   `<h2 class="title">${esc(b.book)}</h2>`
        +   (b.writer ? `<p class="writer">${esc(b.writer)}</p>` : '')
        +   (meta.length
              ? '<div class="meta">' + meta.map(([l, v]) =>
                  `<div><b>${esc(l)}</b><span>${esc(v)}</span></div>`).join('') + '</div>'
              : '')
        +   (b.comment
              ? '<div class="note"><div class="note-label">စာအုပ်ဖတ်ပြီးတွေးမိတာ</div>'
                + esc(b.comment) + '</div>'
              : '')
        + '</div></article>';
    }).join('');

    renderPages(totalPages);
  }

  function renderPages(totalPages) {
    if (totalPages <= 1) { pagesEl.innerHTML = ''; return; }

    const nums = pageNumbers(currentPage, totalPages).map(p =>
      p === '…'
        ? '<span class="dots">…</span>'
        : `<button class="page${p === currentPage ? ' on' : ''}" onclick="goPage(${p})">${p}</button>`
    ).join('');

    pagesEl.innerHTML = '<nav class="pages">'
      + `<button class="page" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>←</button>`
      + nums
      + `<button class="page" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>→</button>`
      + '</nav>'
      + `<p class="page-note">စာမျက်နှာ ${currentPage} / ${totalPages}</p>`;
  }

  function pageNumbers(c, t) {
    if (t <= 7) return Array.from({ length: t }, (_, i) => i + 1);
    const p = [1];
    if (c > 3) p.push('…');
    for (let i = Math.max(2, c - 1); i <= Math.min(t - 1, c + 1); i++) p.push(i);
    if (c < t - 2) p.push('…');
    p.push(t);
    return p;
  }

  function goPage(n) {
    currentPage = n;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function filterBooks() {
    const bq = qBook.value.trim().toLowerCase();
    const wq = qWriter.value.trim().toLowerCase();
    filtered = allBooks.filter(b =>
      (!bq || b.book.toLowerCase().includes(bq)) &&
      (!wq || b.writer.toLowerCase().includes(wq)));
    currentPage = 1;
    render();
  }

  qBook.addEventListener('input', filterBooks);
  qWriter.addEventListener('input', filterBooks);
  document.getElementById('clear').addEventListener('click', () => {
    qBook.value = '';
    qWriter.value = '';
    filterBooks();
  });

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  loadData();
</script>
</body>
</html>
