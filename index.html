<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ဖတ်ဖူးတဲ့ စာအုပ်များ</title>

<!-- set theme before paint so the page never flashes the wrong colours -->
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) { t = null; }
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<style>
  /* ---------- font ---------- */
  @font-face {
    font-family: 'Myanmar Sagar';
    src: url('MyanmarSagar.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  /* ---------- tokens ---------- */
  :root {
    --paper:  #f1efe9;
    --ink:    #3b3833;
    --muted:  #8b8578;
    --rule:   #e2ded4;
    --accent: #55665f;
    --shell:  #e7e3d9;

    --col-margin: 130px;
    --gap: 32px;
  }

  :root[data-theme='dark'] {
    --paper:  #1a1917;
    --ink:    #d4cec2;
    --muted:  #857f74;
    --rule:   #2e2c28;
    --accent: #92a89d;
    --shell:  #26241f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Myanmar Sagar', 'Noto Sans Myanmar', 'Padauk', sans-serif;
    font-size: 17.5px;
    line-height: 2;
    letter-spacing: 0.005em;
    padding: 84px 28px 120px;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* Myanmar line breaking: only break where we inserted a zero-width space,
     never in the middle of a syllable cluster. */
  body,
  .title, .writer, .meta, .note, .subtitle, h1 {
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
    hyphens: none;
  }

  .container { max-width: 1000px; margin: 0 auto; }

  /* ---------- header ---------- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--rule);
  }

  h1 { font-size: 1.7rem; font-weight: 400; line-height: 1.6; letter-spacing: 0.01em; }

  .subtitle { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .who { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  .who-name { font-size: 14.5px; color: var(--muted); }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--shell);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 17px; line-height: 1;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- controls ---------- */
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .count { font-size: 14px; color: var(--muted); }

  .actions { display: flex; align-items: baseline; gap: 20px; }

  .link {
    background: none;
    border: none;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
    transition: color 0.2s;
  }

  .link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .years {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 18px;
    padding-bottom: 2px;
  }

  .year {
    background: none;
    border: none;
    font: inherit;
    font-size: 14.5px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
    transition: color 0.2s;
  }

  .year:hover { color: var(--accent); }
  .year.on { color: var(--ink); border-bottom-color: var(--accent); }

  .search {
    display: none;
    gap: 24px;
    margin-top: 20px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .search.open { display: flex; }

  .field { flex: 1 1 220px; }

  .field input {
    width: 100%;
    padding: 4px 0 9px;
    border: none;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }

  .field input::placeholder { color: var(--muted); }
  .field input:focus { border-bottom-color: var(--accent); }

  /* ---------- entries ---------- */
  .list { margin-top: 8px; }

  .entry {
    display: grid;
    grid-template-columns: var(--col-margin) minmax(0, 1fr);
    gap: var(--gap);
    padding: 34px 0;
    border-bottom: 1px solid var(--rule);
  }

  .when { font-size: 13.5px; color: var(--muted); line-height: 2.1; padding-top: 3px; }

  .title { font-size: 1.28rem; line-height: 1.7; margin-bottom: 2px; font-weight: 400; }

  .writer { font-size: 15.5px; color: var(--accent); margin-bottom: 14px; }

  .meta { font-size: 15px; color: var(--muted); }
  .meta div { display: flex; gap: 8px; }
  .meta b { font-weight: 400; color: var(--muted); flex-shrink: 0; }
  .meta span { color: var(--ink); }

  .note {
    margin-top: 18px;
    padding-left: 18px;
    border-left: 1px solid var(--rule);
    font-size: 16.5px;
    line-height: 2.05;
    white-space: pre-line;
  }

  .note-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  /* ---------- states ---------- */
  .state { padding: 64px 0; color: var(--muted); font-size: 15.5px; }
  .state small { display: block; margin-top: 8px; opacity: 0.7; font-size: 13px; }

  /* ---------- pagination ---------- */
  .pages {
    display: flex; justify-content: center; align-items: center;
    gap: 20px; margin-top: 44px; flex-wrap: wrap;
  }

  .page {
    background: none; border: none; font: inherit; font-size: 15px;
    color: var(--muted); cursor: pointer; padding: 2px 0;
    border-bottom: 1px solid transparent; min-width: 18px;
  }

  .page:hover:not(:disabled) { color: var(--accent); }
  .page.on { color: var(--ink); border-bottom-color: var(--accent); }
  .page:disabled { opacity: 0.28; cursor: default; }

  .dots { color: var(--muted); }

  .page-note { margin-top: 12px; text-align: center; font-size: 13px; color: var(--muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 620px) {
    body { padding: 44px 20px 72px; font-size: 17px; }
    header { flex-direction: column; align-items: flex-start; gap: 18px; }
    h1 { font-size: 1.45rem; }
    .entry { grid-template-columns: 1fr; gap: 6px; padding: 28px 0; }
    .when { padding-top: 0; }
    .years { gap: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1>ဖတ်ဖူးတဲ့ စာအုပ်များ</h1>
      <p class="subtitle"></p>
    </div>
    <div class="who">
      <div class="avatar" id="avatar"><img id="avatarImg" alt="ဟိန်းထက်"></div>
      <span class="who-name">ဟိန်းထက်</span>
    </div>
  </header>

  <div class="bar">
    <span class="count" id="count"></span>
    <div class="actions">
      <button class="link" id="theme">Dark</button>
      <button class="link" id="toggle">ရှာရန်</button>
    </div>
  </div>

  <div class="years" id="years"></div>

  <div class="search" id="search">
    <div class="field"><input type="text" id="qBook" placeholder="စာအုပ်နာမည်"></div>
    <div class="field"><input type="text" id="qWriter" placeholder="စာရေးသူ"></div>
    <button class="link" id="clear">ဖျက်</button>
  </div>

  <div class="list" id="list"><p class="state">ခဏစောင့်ပါ…</p></div>
  <div id="pages"></div>
</div>

<script>
  /* ---------- settings ---------- */
  const CSV_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQGqSeOBUkUNLG0seN_cGPtDp9ldSvKasKVdeDCCliwHwVZQWLRQMtRgbOOtJLUFeZZ9dNiS49GlTKK/pub?gid=910367330&single=true&output=csv';
  const PER_PAGE   = 5;
  const ONLY_EMAIL = 'mynameisheinhtet@gmail.com';

  // tried in order; the first one that loads wins
  const PROFILE_SOURCES = [
    'profile.png', 'Profile.png', 'profile.PNG', 'profile.jpg', 'profile.jpeg',
    'profile.webp', 'images/profile.png', 'assets/profile.png', 'img/profile.png'
  ];

  const COL_EMAIL = 1, COL_BOOK = 2, COL_WRITER = 3, COL_TRANS_FROM = 4,
        COL_ORIG_BOOK = 5, COL_ORIG_WRITER = 6, COL_DATE = 9,
        COL_COMMENT = 10, COL_MONTH = 11, COL_YEAR = 12;

  const MONTHS_MY = ['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်',
                     'ဇူလိုင်','ဩဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];

  const MONTH_EN = ['january','february','march','april','may','june',
                    'july','august','september','october','november','december',
                    'jan','feb','mar','apr','may','jun',
                    'jul','aug','sep','oct','nov','dec'];

  /* ---------- Myanmar line breaking ----------
     Chrome breaks Burmese at arbitrary points, which splits clusters like
     မယ့် into မ / ယ့်. We mark real syllable starts with a zero-width space
     and set word-break: keep-all, so the browser can only break where we say. */
  const MY_BREAK_RE = (function () {
    try {
      const CONS = '\\u1000-\\u102A\\u103F\\u104E';   // consonants + independent vowels
      const SIGN = '\\u102B-\\u1038\\u103B-\\u103E';  // medials, vowel signs, tone marks
      // a consonant starts a syllable unless it follows a virama (stacked)
      // or carries an asat (making it the coda of the syllable before it)
      return new RegExp(`(?<!\\u1039)([${CONS}])(?![${SIGN}]*[\\u103A\\u1039])`, 'g');
    } catch (e) {
      return null; // very old browser without lookbehind — leave text as is
    }
  })();

  function myBreak(s) {
    if (!MY_BREAK_RE || !s) return s;
    return s.replace(MY_BREAK_RE, '\u200B$1');
  }

  // escape after inserting the break marks, so entities never get split
  function txt(s) { return esc(myBreak(s)); }

  /* ---------- profile picture ---------- */
  (function () {
    const box = document.getElementById('avatar');
    const img = document.getElementById('avatarImg');
    let i = 0;
    img.onerror = () => {
      console.warn('no profile image at:', img.getAttribute('src'));
      i++;
      if (i < PROFILE_SOURCES.length) img.src = PROFILE_SOURCES[i];
      else box.textContent = 'ဟ';
    };
    img.onload = () => console.log('profile image loaded from:', img.getAttribute('src'));
    img.src = PROFILE_SOURCES[0];
  })();

  /* ---------- theme ---------- */
  const themeBtn = document.getElementById('theme');

  function paintThemeLabel() {
    themeBtn.textContent =
      document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
  }

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    paintThemeLabel();
  });

  paintThemeLabel();

  /* ---------- state ---------- */
  let allBooks = [], filtered = [], currentPage = 1, activeYear = 'all';

  const listEl   = document.getElementById('list');
  const pagesEl  = document.getElementById('pages');
  const countEl  = document.getElementById('count');
  const yearsEl  = document.getElementById('years');
  const searchEl = document.getElementById('search');
  const qBook    = document.getElementById('qBook');
  const qWriter  = document.getElementById('qWriter');

  document.getElementById('toggle').addEventListener('click', () => {
    searchEl.classList.toggle('open');
    if (searchEl.classList.contains('open')) qBook.focus();
  });

  /* ---------- csv ---------- */
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQ) {
        if (ch === '"' && next === '"') { cell += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cell += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n' || (ch === '\r' && next === '\n')) {
          row.push(cell); cell = '';
          if (row.some(c => c !== '')) rows.push(row);
          row = [];
          if (ch === '\r') i++;
        } else cell += ch;
      }
    }
    row.push(cell);
    if (row.some(c => c !== '')) rows.push(row);
    return rows;
  }

  /* ---------- dates ---------- */
  function monthIndex(name) {
    const idx = MONTH_EN.indexOf(name.toLowerCase().replace(/\./g, ''));
    return idx >= 0 ? idx % 12 : -1;
  }

  function parseDateStr(raw) {
    if (!raw) return null;
    const str = raw.replace(/[\s\u00A0]+/g, ' ').trim();
    if (!str) return null;
    const cleaned = str.replace(/(\d+)(st|nd|rd|th)/gi, '$1');

    const dmy = cleaned.match(/^(\d{1,2})\s+([a-zA-Z]+)\s+(\d{4})$/);
    if (dmy) {
      const m = monthIndex(dmy[2]);
      if (m >= 0) return { mi: m, day: +dmy[1], year: +dmy[3] };
    }

    const mdy = cleaned.match(/^([a-zA-Z]+)\s+(\d{1,2}),?\s+(\d{4})$/);
    if (mdy) {
      const m = monthIndex(mdy[1]);
      if (m >= 0) return { mi: m, day: +mdy[2], year: +mdy[3] };
    }

    const slash = cleaned.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (slash) {
      const a = +slash[1], b = +slash[2], year = +slash[3];
      if (a > 12 && b >= 1 && b <= 12) return { mi: b - 1, day: a, year };
      if (a >= 1 && a <= 12) return { mi: a - 1, day: b, year };
    }

    const iso = cleaned.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) return { mi: +iso[2] - 1, day: +iso[3], year: +iso[1] };

    const d = new Date(cleaned);
    if (!isNaN(d.getTime()) && d.getFullYear() > 2000) {
      return { mi: d.getMonth(), day: d.getDate(), year: d.getFullYear() };
    }
    return null;
  }

  function getDate(r) {
    const m = (r[COL_MONTH] || '').trim();
    const y = (r[COL_YEAR] || '').trim();
    let mi = -1, yr = 0;

    if (m) {
      mi = monthIndex(m);
      if (mi < 0) { const n = parseInt(m, 10); if (n >= 1 && n <= 12) mi = n - 1; }
      if (mi < 0) { const j = MONTHS_MY.indexOf(m); if (j >= 0) mi = j; }
    }
    if (y) yr = parseInt(y, 10) || 0;

    if (mi >= 0 && yr > 2000) {
      const raw = parseDateStr(r[COL_DATE]);
      const day = (raw && raw.year === yr && raw.mi === mi) ? raw.day : 0;
      return { mi, day, year: yr };
    }
    return parseDateStr(r[COL_DATE]);
  }

  /* ---------- load ---------- */
  async function loadData() {
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = parseCSV(await res.text()).slice(1);

      allBooks = rows.map((r, rowIndex) => {
        const email = (r[COL_EMAIL] || '').trim().toLowerCase();
        const book  = (r[COL_BOOK] || '').trim();
        if (email !== ONLY_EMAIL || !book) return null;
        const dt = getDate(r);
        return {
          rowIndex,
          book,
          writer:     (r[COL_WRITER] || '').trim(),
          transFrom:  (r[COL_TRANS_FROM] || '').trim(),
          origBook:   (r[COL_ORIG_BOOK] || '').trim(),
          origWriter: (r[COL_ORIG_WRITER] || '').trim(),
          comment:    (r[COL_COMMENT] || '').trim(),
          mi:   dt ? dt.mi : -1,
          day:  dt ? (dt.day || 0) : 0,
          year: dt ? dt.year : 0
        };
      }).filter(Boolean);

      // newest first; undated entries sink to the bottom in sheet order
      allBooks.sort((a, b) => {
        if (!a.year && !b.year) return b.rowIndex - a.rowIndex;
        if (!a.year) return 1;
        if (!b.year) return -1;
        return (b.year - a.year) || (b.mi - a.mi) || (b.day - a.day) || (b.rowIndex - a.rowIndex);
      });

      if (!allBooks.length) {
        listEl.innerHTML = '<p class="state">စာအုပ်မှတ်တမ်း မရှိသေးပါ</p>';
        return;
      }

      renderYears();
      applyFilters();
    } catch (err) {
      listEl.innerHTML = '<p class="state">ဒေတာ ခေါ်မရပါ။ Sheet ကို Publish လုပ်ထားခြင်း ရှိ၊ မရှိ စစ်ပါ။'
        + '<small>' + esc(err.message) + '</small></p>';
    }
  }

  /* ---------- year filter ---------- */
  function renderYears() {
    const years = [...new Set(allBooks.map(b => b.year).filter(Boolean))].sort((a, b) => b - a);
    if (!years.length) { yearsEl.innerHTML = ''; return; }

    yearsEl.innerHTML =
      '<button class="year on" data-year="all">အားလုံး</button>'
      + years.map(y => `<button class="year" data-year="${y}">${y}</button>`).join('');

    yearsEl.querySelectorAll('.year').forEach(btn => {
      btn.addEventListener('click', () => {
        activeYear = btn.dataset.year;
        yearsEl.querySelectorAll('.year').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        applyFilters();
      });
    });
  }

  function applyFilters() {
    const bq = qBook.value.trim().toLowerCase();
    const wq = qWriter.value.trim().toLowerCase();

    filtered = allBooks.filter(b =>
      (activeYear === 'all' || String(b.year) === activeYear) &&
      (!bq || b.book.toLowerCase().includes(bq)) &&
      (!wq || b.writer.toLowerCase().includes(wq)));

    currentPage = 1;
    render();
  }

  /* ---------- render ---------- */
  function render() {
    const total = filtered.length;
    const totalPages = Math.ceil(total / PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages || 1;

    if (!total) {
      listEl.innerHTML = '<p class="state">ကိုက်ညီသော စာအုပ် မတွေ့ပါ</p>';
      pagesEl.innerHTML = '';
      countEl.textContent = '';
      return;
    }

    const narrowed = qBook.value || qWriter.value || activeYear !== 'all';
    countEl.textContent = narrowed ? `တွေ့ရှိသည် — ${total} အုပ်` : `စုစုပေါင်း ${total} အုပ်`;

    const page = filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

    listEl.innerHTML = page.map(b => {
      const when = b.year
        ? (b.mi >= 0 ? MONTHS_MY[b.mi] + ' ' + b.year : String(b.year))
        : '';

      const meta = [];
      if (b.transFrom)  meta.push(['ဘာသာပြန်', b.transFrom]);
      if (b.origBook)   meta.push(['မူရင်းစာအုပ်', b.origBook]);
      if (b.origWriter) meta.push(['မူရင်းစာရေးသူ', b.origWriter]);

      return '<article class="entry">'
        + `<div class="when">${txt(when)}</div>`
        + '<div>'
        +   `<h2 class="title">${txt(b.book)}</h2>`
        +   (b.writer ? `<p class="writer">${txt(b.writer)}</p>` : '')
        +   (meta.length
              ? '<div class="meta">' + meta.map(([l, v]) =>
                  `<div><b>${txt(l)}</b><span>${txt(v)}</span></div>`).join('') + '</div>'
              : '')
        +   (b.comment
              ? '<div class="note"><div class="note-label">စာအုပ်ဖတ်ပြီးတွေးမိတာ</div>'
                + txt(b.comment) + '</div>'
              : '')
        + '</div></article>';
    }).join('');

    renderPages(totalPages);
  }

  function renderPages(totalPages) {
    if (totalPages <= 1) { pagesEl.innerHTML = ''; return; }

    const nums = pageNumbers(currentPage, totalPages).map(p =>
      p === '…'
        ? '<span class="dots">…</span>'
        : `<button class="page${p === currentPage ? ' on' : ''}" onclick="goPage(${p})">${p}</button>`
    ).join('');

    pagesEl.innerHTML = '<nav class="pages">'
      + `<button class="page" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>←</button>`
      + nums
      + `<button class="page" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>→</button>`
      + '</nav>'
      + `<p class="page-note">စာမျက်နှာ ${currentPage} / ${totalPages}</p>`;
  }

  function pageNumbers(c, t) {
    if (t <= 7) return Array.from({ length: t }, (_, i) => i + 1);
    const p = [1];
    if (c > 3) p.push('…');
    for (let i = Math.max(2, c - 1); i <= Math.min(t - 1, c + 1); i++) p.push(i);
    if (c < t - 2) p.push('…');
    p.push(t);
    return p;
  }

  function goPage(n) {
    currentPage = n;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  qBook.addEventListener('input', applyFilters);
  qWriter.addEventListener('input', applyFilters);
  document.getElementById('clear').addEventListener('click', () => {
    qBook.value = '';
    qWriter.value = '';
    applyFilters();
  });

  function esc(s) {
    const d = document.createElement('div');
